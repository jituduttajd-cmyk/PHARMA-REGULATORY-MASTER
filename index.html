<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharma Regulatory Master — Preview</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Cambria,Georgia,serif;background:#f4f7fb;color:#172033}
.app{max-width:1250px;margin:auto;padding:22px}
.header{background:#fff;border:1px solid #d9e1ec;border-radius:14px;padding:20px 24px;box-shadow:0 4px 18px rgba(20,40,70,.06)}
.header h1{margin:0;color:#12345b;font-size:25px}
.header p{margin:6px 0 0;color:#667085;font-family:Arial,sans-serif;font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.tab{border:1px solid #cbd5e1;background:#fff;color:#173b63;padding:11px 18px;border-radius:9px;font-weight:700;cursor:pointer}
.tab.active{background:#123d68;color:#fff;border-color:#123d68}
.card{background:#fff;border:1px solid #d9e1ec;border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(20,40,70,.05)}
.title{display:flex;justify-content:space-between;align-items:center;gap:12px}
.title h2{margin:0;color:#12345b;font-size:20px}
.count{font-family:Arial,sans-serif;background:#edf4fb;color:#123d68;padding:7px 11px;border-radius:20px;font-size:12px;font-weight:700}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin:18px 0}
input,select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;background:#fff}
button{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}
.search{background:#123d68;color:#fff}.reset{background:#eef2f6;color:#23354d}
.subtabs{display:flex;gap:6px;margin:4px 0 16px;border-bottom:1px solid #e2e8f0;padding-bottom:10px;flex-wrap:wrap}
.subtab{background:#f5f7fa;border:1px solid #d8e0e9;color:#29435f;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:700}
.subtab.active{background:#e7f0f9;color:#123d68;border-color:#9fb8d1}
.table-wrap{overflow:auto;border:1px solid #e1e7ef;border-radius:9px}
table{width:100%;border-collapse:collapse;min-width:850px;font-family:Arial,sans-serif;font-size:13px}
th{background:#123d68;color:#fff;text-align:left;padding:11px 10px;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #edf0f4;white-space:nowrap}
tr:nth-child(even) td{background:#f8fafc}
.status{font-weight:700;padding:5px 9px;border-radius:15px;font-size:11px}
.active-status{background:#e7f6ec;color:#177245}.open-status{background:#fff4d6;color:#8a5a00}.banned{background:#fde8e8;color:#b42318}
.footer{padding:14px 2px;text-align:center;color:#7a8798;font:12px Arial,sans-serif}
@media(max-width:700px){
.app{padding:10px}.header{padding:16px}.header h1{font-size:21px}
.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{padding:10px;font-size:12px}
.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.filters button{width:100%}
.title{align-items:flex-start}.title h2{font-size:17px}.card{padding:14px}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>PHARMA REGULATORY MASTER</h1>
    <p>Regulatory & Compliance Information System</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('banned',this)">Banned Product</button>
    <button class="tab" onclick="showTab('schedule',this)">Schedule List</button>
    <button class="tab" onclick="showTab('letters',this)">Govt. Letter Status</button>
    <button class="tab" onclick="showTab('amendment',this)">Regulatory Amendment</button>
  </div>

  <div class="card" id="content"></div>
  <div class="footer">Premium Pharma • Clean White + Navy • Responsive PWA Preview</div>
</div>

<script>
const data={
banned:{title:"BANNED PRODUCT MASTER",count:"128 Records",cols:["Sr. No.","Product / Drug","Authority","Order No.","Date","Status"],rows:[
["1","Product / Drug A","CDSCO","CDSCO/2026/001","10-06-2026","Banned"],
["2","Product / Drug B","State FDA","FDA/2026/017","18-06-2026","Banned"],
["3","Product / Drug C","NPPA","NPPA/2026/031","22-06-2026","Banned"]]},
schedule:{title:"SCHEDULE MASTER",count:"342 Records",cols:["Sr. No.","Drug / Product","Schedule","Dosage Form","Strength","Authority"],rows:[
["1","Drug A","Schedule H","Tablet","500 mg","CDSCO"],
["2","Drug B","Schedule H1","Injection","1 g","CDSCO"],
["3","Drug C","Schedule X","Tablet","10 mg","CDSCO"]]},
letters:{title:"GOVT. LETTER STATUS",count:"96 Records",sub:true,cols:["Sr. No.","Authority","Letter No.","Letter Date","Subject","Status"],rows:[
["1","NPPA","NPPA/LET/001","01-06-2026","Pricing clarification","Open"],
["2","State FDA","FDA/LET/021","12-06-2026","Manufacturing matter","Closed"],
["3","CDSCO","CDSCO/LET/043","20-06-2026","Regulatory query","Open"],
["4","FSSAI","FSSAI/LET/018","25-06-2026","Food compliance","Closed"]]},
amendment:{title:"REGULATORY AMENDMENT MASTER",count:"74 Records",sub:true,cols:["Sr. No.","Authority","Amendment / Notification","Effective Date","Reference","Status"],rows:[
["1","NPPA","DPCO Amendment","01-07-2026","G.S.R. XXX","Active"],
["2","State FDA","State Drug Rules Amendment","05-07-2026","Notification XXX","Active"],
["3","CDSCO","Drugs Rules Amendment","15-07-2026","G.S.R. XXX","Active"],
["4","FSSAI","Food Regulation Amendment","20-07-2026","FSSAI/XXX","Active"]]}
};
function showTab(key,el){
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');
const d=data[key];
let html=`<div class="title"><h2>${d.title}</h2><span class="count">${d.count}</span></div>`;
if(d.sub) html+=`<div class="subtabs">
<button class="subtab active">All</button><button class="subtab">NPPA</button><button class="subtab">State FDA</button><button class="subtab">CDSCO</button><button class="subtab">FSSAI</button>
</div>`;
html+=`<div class="filters"><input placeholder="Search ${key==='letters'?'letter / subject / authority':'product / drug / notification'}..."><select><option>All Status</option><option>Active</option><option>Open</option><option>Closed</option><option>Banned</option></select><select><option>All Years</option><option>2026</option><option>2025</option></select><button class="search">Search</button><button class="reset">Reset</button></div>`;
html+=`<div class="table-wrap"><table><thead><tr>${d.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
d.rows.forEach(r=>{html+=`<tr>${r.map((v,i)=>`<td>${i===r.length-1?`<span class="status ${v==='Banned'?'banned':v==='Open'?'open-status':'active-status'}">${v}</span>`:v}</td>`).join('')}</tr>`});
html+=`</tbody></table></div>`;
document.getElementById('content').innerHTML=html;
}
showTab('banned',document.querySelector('.tab'));
</script>
</body>
</html>
