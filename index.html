<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12395f">
<title>Pharma Regulatory & Pricing Master</title>

<style>
:root{
    --navy:#12395f;
    --navy2:#0b2d4a;
    --blue:#1e5b8f;
    --bg:#f4f7fa;
    --white:#fff;
    --border:#d8e0e8;
    --text:#1f2937;
    --muted:#667085;
    --lightblue:#eef5fa;
}
*{box-sizing:border-box}
body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Cambria,Georgia,serif;
}
.header{
    background:#fff;
    border-bottom:3px solid var(--navy);
    padding:16px 24px;
}
.header h1{
    margin:0;
    color:var(--navy);
    font-size:25px;
}
.header p{
    margin:5px 0 0;
    color:var(--muted);
    font:12px Arial,sans-serif;
}
.container{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

/* MAIN TABS */
.main-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
}
.main-tab{
    padding:11px 16px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:7px;
    color:var(--navy);
    font-family:Cambria,Georgia,serif;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}
.main-tab:hover{background:#edf4fa}
.main-tab.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
}

/* CARD */
.card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
    min-height:600px;
}
.heading-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding-bottom:12px;
    border-bottom:1px solid var(--border);
}
.heading-row h2{
    margin:0;
    color:var(--navy);
    font-size:21px;
}
.count{
    background:var(--lightblue);
    color:var(--navy);
    border-radius:20px;
    padding:7px 13px;
    font:12px Arial,sans-serif;
    font-weight:bold;
}

/* NAVIGATION */
.nav-area{
    margin:18px 0 12px;
}
.nav-level{
    margin-bottom:12px;
}
.nav-label{
    color:#475467;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}
.tab-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}
.sub-tab{
    padding:9px 15px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:7px;
    color:#344054;
    font-family:Cambria,Georgia,serif;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}
.sub-tab:hover{
    background:#edf4fa;
}
.sub-tab.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
}

/* BREADCRUMB */
.breadcrumb{
    padding:9px 12px;
    background:#f7f9fb;
    border:1px solid var(--border);
    border-radius:7px;
    margin:14px 0;
    font:12px Arial,sans-serif;
    overflow-x:auto;
    white-space:nowrap;
}
.bc-link{
    color:var(--navy);
    font-weight:bold;
    cursor:pointer;
}
.bc-sep{
    margin:0 8px;
    color:#98a2b3;
}

/* SEARCH */
.search-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin:16px 0;
}
.search-box{
    width:100%;
    padding:11px 13px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    font:13px Arial,sans-serif;
    outline:none;
}
.search-box:focus{border-color:var(--blue)}
.reset-btn{
    padding:10px 20px;
    background:#f3f5f7;
    border:1px solid var(--border);
    border-radius:7px;
    font-family:Cambria,Georgia,serif;
    font-weight:bold;
    cursor:pointer;
}

/* TABLE */
.table-wrap{
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:8px;
}
table{
    width:100%;
    min-width:650px;
    border-collapse:collapse;
    font:13px Arial,sans-serif;
}
thead{
    background:var(--navy);
    color:#fff;
}
th{
    text-align:left;
    padding:12px;
}
td{
    padding:11px 12px;
    border-bottom:1px solid #e7edf2;
}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:#eef5fa}
.message{
    text-align:center;
    padding:45px!important;
    color:var(--muted);
}
.view-btn{
    padding:7px 13px;
    border:0;
    border-radius:6px;
    background:var(--navy);
    color:#fff;
    font-family:Cambria,Georgia,serif;
    font-weight:bold;
    cursor:pointer;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,.65);
    padding:15px;
}
.modal.show{
    display:flex;
    align-items:center;
    justify-content:center;
}
.modal-box{
    width:98%;
    height:95vh;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}
.modal-header{
    background:var(--navy);
    color:#fff;
    padding:11px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}
.modal-title{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.modal-actions{
    display:flex;
    gap:7px;
}
.modal-actions button,
.modal-actions a{
    background:#fff;
    color:var(--navy);
    border:0;
    border-radius:5px;
    padding:7px 10px;
    text-decoration:none;
    font:12px Arial,sans-serif;
    font-weight:bold;
    cursor:pointer;
}
.pdf-frame{
    flex:1;
    width:100%;
    border:0;
}

/* FOOTER */
.footer{
    text-align:center;
    padding:18px;
    font:11px Arial,sans-serif;
    color:var(--muted);
}

/* MOBILE */
@media(max-width:768px){
    .header{padding:14px}
    .header h1{font-size:19px}
    .container{padding:10px}
    .main-tabs{
        display:grid;
        grid-template-columns:repeat(2,1fr);
    }
    .main-tab{
        font-size:11px;
        padding:10px 6px;
        min-height:42px;
    }
    .card{padding:12px}
    .heading-row h2{font-size:17px}
    .tab-row{
        flex-wrap:nowrap;
        overflow-x:auto;
        padding-bottom:5px;
    }
    .sub-tab{
        flex-shrink:0;
        white-space:nowrap;
    }
    .search-row{grid-template-columns:1fr}
    .modal{padding:0}
    .modal-box{
        width:100%;
        height:100vh;
        border-radius:0;
    }
    .modal-title{
        max-width:45vw;
        font-size:12px;
    }
    .modal-actions a{display:none}
}
</style>
</head>

<body>

<header class="header">
    <h1>PHARMA REGULATORY & PRICING MASTER</h1>
    <p>Centralized Regulatory, Government Notification & Pricing Information System</p>
</header>

<div class="container">

    <!-- MAIN TABS -->
    <div class="main-tabs" id="mainTabs"></div>

    <div class="card">

        <div class="heading-row">
            <h2 id="pageTitle"></h2>
            <span class="count" id="recordCount">0 Documents</span>
        </div>

        <div class="breadcrumb" id="breadcrumb"></div>

        <!-- ALL SUB TABS WILL APPEAR HERE -->
        <div class="nav-area" id="navigationArea"></div>

        <div class="search-row">
            <input type="text" id="searchInput"
                class="search-box"
                placeholder="Search PDF document name..."
                oninput="filterPDFs()">
            <button class="reset-btn" onclick="resetSearch()">Reset</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width:80px">Sr. No.</th>
                        <th>PDF Document Name</th>
                        <th style="width:140px">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>

    <div class="footer">
        Pharma Regulatory & Pricing Master
    </div>

</div>

<!-- PDF VIEWER -->
<div class="modal" id="pdfModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title" id="pdfTitle">Document Viewer</div>
            <div class="modal-actions">
                <a id="newTabLink" href="#" target="_blank">Open New Tab</a>
                <button onclick="closePDF()">✕ Close</button>
            </div>
        </div>
        <iframe class="pdf-frame" id="pdfFrame"></iframe>
    </div>
</div>

<script>
/* ============================================================
   GITHUB CONFIGURATION
   ============================================================ */
const GITHUB_OWNER = "YOUR-GITHUB-USERNAME";
const GITHUB_REPO = "YOUR-REPOSITORY-NAME";
const GITHUB_BRANCH = "main";

/* ============================================================
   COMPLETE FIXED STRUCTURE
   All required tabs are visible even if GitHub folders are empty.
   ============================================================ */
const APP_STRUCTURE = {
    "Banned Product Master": {
        path: "data/banned-product"
    },

    "Schedule Master": {
        path: "data/schedule"
    },

    "Government Letter Master": {
        path: "data/government-letter",
        children: {
            "NPPA": { path: "data/government-letter/nppa" },
            "State FDA": { path: "data/government-letter/state-fda" },
            "CDSCO": { path: "data/government-letter/cdsco" },
            "FSSAI": { path: "data/government-letter/fssai" }
        }
    },

    "Regulatory Amendment Master": {
        path: "data/regulatory-amendment",
        children: {
            "NPPA": { path: "data/regulatory-amendment/nppa" },
            "State FDA": { path: "data/regulatory-amendment/state-fda" },
            "CDSCO": { path: "data/regulatory-amendment/cdsco" },
            "FSSAI": { path: "data/regulatory-amendment/fssai" }
        }
    },

    "NPPA Pricing": {
        path: "data/nppa-pricing",
        children: {
            "Ceiling Price": {
                path: "data/nppa-pricing/ceiling-price"
            },
            "Retail Price": {
                path: "data/nppa-pricing/retail-price"
            }
        }
    },

    "Notifications": {
        path: "data/notifications",
        children: {

            "CDSCO": {
                path: "data/notifications/cdsco",
                children: {
                    "Act & Rules": {
                        path: "data/notifications/cdsco/act-rules"
                    },
                    "Amendment": {
                        path: "data/notifications/cdsco/amendment"
                    },
                    "Circular": {
                        path: "data/notifications/cdsco/circular"
                    },
                    "Gazette Notification": {
                        path: "data/notifications/cdsco/gazette-notification"
                    },
                    "Public Notice": {
                        path: "data/notifications/cdsco/public-notice"
                    }
                }
            },

            "NPPA": {
                path: "data/notifications/nppa",
                children: {
                    "DPCO Act": {
                        path: "data/notifications/nppa/dpco-act"
                    },
                    "Amendment": {
                        path: "data/notifications/nppa/amendment"
                    },
                    "Gazette Notification": {
                        path: "data/notifications/nppa/gazette-notification"
                    },
                    "OM": {
                        path: "data/notifications/nppa/om"
                    },
                    "Circular": {
                        path: "data/notifications/nppa/circular"
                    }
                }
            },

            "State FDA": {
                path: "data/notifications/state-fda"
            },

            "FSSAI": {
                path: "data/notifications/fssai",
                children: {
                    "Act & Rule": {
                        path: "data/notifications/fssai/act-rule"
                    },
                    "Regulation": {
                        path: "data/notifications/fssai/regulation"
                    },
                    "Notification": {
                        path: "data/notifications/fssai/notification"
                    },
                    "Advisory Order": {
                        path: "data/notifications/fssai/advisory-order"
                    }
                }
            },

            "Legal Metrology Act": {
                path: "data/notifications/legal-metrology-act",
                children: {
                    "Legal Metrology Act": {
                        path: "data/notifications/legal-metrology-act/legal-metrology-act"
                    },
                    "Legal Metrology Numbering Rules 2011": {
                        path: "data/notifications/legal-metrology-act/legal-metrology-numbering-rules-2011"
                    },
                    "Legal Metrology Packaged Commodities Rules 2011": {
                        path: "data/notifications/legal-metrology-act/legal-metrology-packaged-commodities-rules-2011"
                    }
                }
            },

            "UCPMP": {
                path: "data/notifications/ucpmp"
            },

            "Medical Device": {
                path: "data/notifications/medical-device"
            }
        }
    }
};

/* ============================================================
   APPLICATION STATE
   ============================================================ */
let activeMainName = "";
let activeMainObject = null;
let selectedNodes = [];
let currentNode = null;
let currentPDFs = [];

const API_BASE = () =>
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents`;

const RAW_BASE = () =>
    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}`;

/* ============================================================
   INITIALIZE
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
    renderMainTabs();

    const firstMain = Object.keys(APP_STRUCTURE)[0];
    openMain(firstMain);
});

/* ============================================================
   MAIN TABS
   ============================================================ */
function renderMainTabs() {
    const container = document.getElementById("mainTabs");

    container.innerHTML = Object.keys(APP_STRUCTURE).map(name => `
        <button class="main-tab"
            data-main="${escapeAttr(name)}"
            onclick="openMain(${JSON.stringify(name)})">
            ${escapeHTML(name)}
        </button>
    `).join("");
}

function openMain(name) {
    activeMainName = name;
    activeMainObject = APP_STRUCTURE[name];
    currentNode = activeMainObject;
    selectedNodes = [];
    currentPDFs = [];

    document.querySelectorAll(".main-tab").forEach(btn => {
        btn.classList.toggle(
            "active",
            btn.dataset.main === name
        );
    });

    document.getElementById("pageTitle").textContent =
        name.toUpperCase();

    document.getElementById("searchInput").value = "";

    renderNavigation();
    loadPDFs(activeMainObject.path);
}

/* ============================================================
   DYNAMIC NAVIGATION
   Shows all predefined tabs AND auto-detected new folders.
   ============================================================ */
function renderNavigation() {
    const area = document.getElementById("navigationArea");

    let html = "";
    let node = activeMainObject;

    selectedNodes.forEach((selectedName, level) => {
        if (!node.children || !node.children[selectedName]) return;

        const children = node.children;

        html += `
            <div class="nav-level">
                <div class="nav-label">
                    ${level === 0 ? "Select Category" : "Select Sub Category"}
                </div>
                <div class="tab-row">
                    ${Object.keys(children).map(childName => `
                        <button class="sub-tab ${selectedName === childName ? "active" : ""}"
                            onclick="selectNode(${level}, ${JSON.stringify(childName)})">
                            ${escapeHTML(childName)}
                        </button>
                    `).join("")}
                </div>
            </div>
        `;

        node = node.children[selectedName];
    });

    if (node.children && Object.keys(node.children).length) {
        const level = selectedNodes.length;

        html += `
            <div class="nav-level">
                <div class="nav-label">
                    ${level === 0 ? "Select Category" : "Select Sub Category"}
                </div>
                <div class="tab-row">
                    ${Object.keys(node.children).map(childName => `
                        <button class="sub-tab"
                            onclick="selectNode(${level}, ${JSON.stringify(childName)})">
                            ${escapeHTML(childName)}
                        </button>
                    `).join("")}
                </div>
            </div>
        `;
    }

    area.innerHTML = html;

    renderBreadcrumb();
}

/* ============================================================
   SELECT SUB TAB
   ============================================================ */
function selectNode(level, name) {
    selectedNodes = selectedNodes.slice(0, level);
    selectedNodes.push(name);

    let node = activeMainObject;

    for (const selectedName of selectedNodes) {
        node = node.children[selectedName];
    }

    currentNode = node;
    document.getElementById("searchInput").value = "";

    renderNavigation();
    loadPDFs(node.path);
}

/* ============================================================
   BREADCRUMB
   ============================================================ */
function renderBreadcrumb() {
    const bc = document.getElementById("breadcrumb");

    let html = `
        <span class="bc-link" onclick="openMain(${JSON.stringify(activeMainName)})">
            ${escapeHTML(activeMainName)}
        </span>
    `;

    selectedNodes.forEach((name, index) => {
        html += `
            <span class="bc-sep">›</span>
            <span class="bc-link" onclick="goBreadcrumb(${index})">
                ${escapeHTML(name)}
            </span>
        `;
    });

    bc.innerHTML = html;
}

function goBreadcrumb(index) {
    selectedNodes = selectedNodes.slice(0, index + 1);

    let node = activeMainObject;

    for (const name of selectedNodes) {
        node = node.children[name];
    }

    currentNode = node;

    document.getElementById("searchInput").value = "";

    renderNavigation();
    loadPDFs(node.path);
}

/* ============================================================
   LOAD PDF FROM GITHUB
   ============================================================ */
async function loadPDFs(folderPath) {
    showLoading();

    if (
        GITHUB_OWNER === "YOUR-GITHUB-USERNAME" ||
        GITHUB_REPO === "YOUR-REPOSITORY-NAME"
    ) {
        currentPDFs = [];
        showMessage(
            "Please update GitHub Username and Repository Name in the configuration."
        );
        return;
    }

    try {
        const url =
            `${API_BASE()}/${encodePath(folderPath)}?ref=${encodeURIComponent(GITHUB_BRANCH)}`;

        const response = await fetch(url);

        if (!response.ok) {
            if (response.status === 404) {
                currentPDFs = [];
                showMessage("No PDF document available in this folder.");
                return;
            }
            throw new Error("Unable to load folder from GitHub.");
        }

        const items = await response.json();

        currentPDFs = items
            .filter(item =>
                item.type === "file" &&
                item.name.toLowerCase().endsWith(".pdf")
            )
            .sort((a, b) =>
                a.name.localeCompare(b.name, undefined, { numeric: true })
            );

        renderPDFTable(currentPDFs);

    } catch (error) {
        console.error(error);
        currentPDFs = [];
        showMessage(
            "Unable to load PDF documents. Please check GitHub configuration and folder path."
        );
    }
}

/* ============================================================
   PDF TABLE
   ============================================================ */
function renderPDFTable(pdfs) {
    const tbody = document.getElementById("tableBody");

    if (!pdfs.length) {
        showMessage("No PDF document available in this folder.");
        return;
    }

    tbody.innerHTML = pdfs.map((pdf, index) => {
        const pdfName = pdf.name.replace(/\.pdf$/i, "");
        const pdfURL = `${RAW_BASE()}/${encodePath(pdf.path)}`;

        return `
            <tr>
                <td>${index + 1}</td>
                <td>${escapeHTML(pdfName)}</td>
                <td>
                    <button class="view-btn"
                        onclick='openPDF(${JSON.stringify(pdfURL)}, ${JSON.stringify(pdfName)})'>
                        View PDF
                    </button>
                </td>
            </tr>
        `;
    }).join("");

    updateCount(pdfs.length);
}

function showLoading() {
    document.getElementById("tableBody").innerHTML = `
        <tr>
            <td colspan="3" class="message">Loading documents...</td>
        </tr>
    `;
    document.getElementById("recordCount").textContent = "Loading...";
}

function showMessage(message) {
    document.getElementById("tableBody").innerHTML = `
        <tr>
            <td colspan="3" class="message">${escapeHTML(message)}</td>
        </tr>
    `;
    updateCount(0);
}

function updateCount(count) {
    document.getElementById("recordCount").textContent =
        `${count} ${count === 1 ? "Document" : "Documents"}`;
}

/* ============================================================
   SEARCH
   ============================================================ */
function filterPDFs() {
    const keyword =
        document.getElementById("searchInput").value
            .toLowerCase()
            .trim();

    const filtered = currentPDFs.filter(pdf =>
        pdf.name.toLowerCase().includes(keyword)
    );

    renderPDFTable(filtered);
}

function resetSearch() {
    document.getElementById("searchInput").value = "";
    renderPDFTable(currentPDFs);
}

/* ============================================================
   PDF VIEWER
   ============================================================ */
function openPDF(url, title) {
    document.getElementById("pdfTitle").textContent = title;
    document.getElementById("pdfFrame").src = url;
    document.getElementById("newTabLink").href = url;
    document.getElementById("pdfModal").classList.add("show");
}

function closePDF() {
    document.getElementById("pdfFrame").src = "";
    document.getElementById("pdfModal").classList.remove("show");
}

document.addEventListener("keydown", event => {
    if (event.key === "Escape") closePDF();
});

document.getElementById("pdfModal").addEventListener("click", event => {
    if (event.target.id === "pdfModal") closePDF();
});

/* ============================================================
   UTILITIES
   ============================================================ */
function encodePath(path) {
    return String(path)
        .split("/")
        .map(x => encodeURIComponent(x))
        .join("/");
}

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttr(value) {
    return escapeHTML(value);
}
</script>

</body>
</html>
