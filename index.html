<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12395f">

<title>Pharma Regulatory & Pricing Master</title>

<style>
:root{
    --navy:#12395f;
    --navy-dark:#092a49;
    --blue:#1e5b8f;
    --light-blue:#edf5fb;
    --border:#d7e0e9;
    --bg:#f4f7fa;
    --white:#ffffff;
    --text:#1d2939;
    --muted:#667085;
    --green:#198754;
    --red:#b42318;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:Cambria,Georgia,serif;
    background:var(--bg);
    color:var(--text);
}

/* =========================================
   HEADER
========================================= */

.header{
    background:#fff;
    border-bottom:3px solid var(--navy);
    padding:16px 25px;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-inner{
    max-width:1500px;
    margin:auto;
}

.header h1{
    margin:0;
    color:var(--navy);
    font-size:25px;
    font-weight:700;
}

.header p{
    margin:5px 0 0;
    color:var(--muted);
    font-family:Arial,sans-serif;
    font-size:12px;
}

/* =========================================
   CONTAINER
========================================= */

.container{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

/* =========================================
   MAIN NAVIGATION
========================================= */

.main-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
}

.main-tab{
    border:1px solid var(--border);
    background:#fff;
    color:var(--navy);
    padding:11px 17px;
    border-radius:8px;
    cursor:pointer;
    font-family:Cambria,Georgia,serif;
    font-size:14px;
    font-weight:700;
    transition:.2s;
}

.main-tab:hover{
    background:#edf4fa;
}

.main-tab.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
}

/* =========================================
   CARD
========================================= */

.content-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    min-height:550px;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.page-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    border-bottom:1px solid var(--border);
    padding-bottom:13px;
}

.page-heading h2{
    margin:0;
    color:var(--navy);
    font-size:21px;
}

.record-count{
    background:var(--light-blue);
    color:var(--navy);
    border-radius:20px;
    padding:7px 13px;
    font-family:Arial,sans-serif;
    font-size:12px;
    font-weight:bold;
}

/* =========================================
   BREADCRUMB
========================================= */

.breadcrumb{
    margin-top:14px;
    padding:9px 12px;
    background:#f6f9fc;
    border:1px solid var(--border);
    border-radius:7px;
    color:#667085;
    font-family:Arial,sans-serif;
    font-size:12px;
    display:none;
}

.breadcrumb span{
    color:var(--navy);
    font-weight:bold;
}

/* =========================================
   DYNAMIC TABS
========================================= */

.dynamic-tabs{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:18px;
    margin-bottom:12px;
}

.dynamic-tabs.level-2{
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
}

.dynamic-tabs.level-3{
    padding:12px;
    background:#f7f9fb;
    border-left:4px solid var(--navy);
    border-radius:7px;
}

.dynamic-tab{
    padding:9px 15px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:7px;
    color:#344054;
    cursor:pointer;
    font-family:Cambria,Georgia,serif;
    font-size:13px;
    font-weight:bold;
    transition:.2s;
}

.dynamic-tab:hover{
    background:#edf4fa;
}

.dynamic-tab.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
}

/* =========================================
   PDF SEARCH
========================================= */

.search-area{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin:18px 0;
}

.search-box{
    width:100%;
    padding:11px 13px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    font-family:Arial,sans-serif;
    font-size:13px;
    outline:none;
}

.search-box:focus{
    border-color:var(--blue);
}

.btn-reset{
    padding:10px 20px;
    background:#f1f4f7;
    border:1px solid var(--border);
    border-radius:7px;
    cursor:pointer;
    font-family:Cambria,Georgia,serif;
    font-weight:bold;
    color:#344054;
}

/* =========================================
   TABLE
========================================= */

.table-wrapper{
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:8px;
}

table{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
    font-family:Arial,sans-serif;
    font-size:13px;
}

thead{
    background:var(--navy);
    color:#fff;
}

th{
    padding:12px;
    text-align:left;
}

td{
    padding:11px 12px;
    border-bottom:1px solid #e8edf2;
}

tbody tr:nth-child(even){
    background:#f8fafc;
}

tbody tr:hover{
    background:#edf5fb;
}

.no-data{
    text-align:center;
    padding:45px !important;
    color:#667085;
    font-family:Cambria,Georgia,serif;
    font-size:15px;
}

.loading{
    text-align:center;
    padding:45px !important;
    color:#667085;
}

.pdf-name{
    font-weight:600;
    color:#344054;
}

.view-pdf-btn{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:7px 13px;
    border-radius:6px;
    cursor:pointer;
    font-family:Cambria,Georgia,serif;
    font-weight:bold;
    white-space:nowrap;
}

.view-pdf-btn:hover{
    background:var(--navy-dark);
}

/* =========================================
   MESSAGE
========================================= */

.info-box{
    margin:20px 0;
    padding:18px;
    border:1px dashed #b8c6d3;
    border-radius:8px;
    background:#fafcff;
    color:#667085;
    font-family:Arial,sans-serif;
    font-size:13px;
    line-height:1.6;
}

/* =========================================
   PDF MODAL
========================================= */

.pdf-modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,.65);
    padding:15px;
}

.pdf-modal.show{
    display:flex;
    align-items:center;
    justify-content:center;
}

.pdf-modal-content{
    width:98%;
    height:95vh;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.pdf-header{
    background:var(--navy);
    color:#fff;
    padding:12px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.pdf-title{
    font-size:15px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.pdf-actions{
    display:flex;
    gap:8px;
    align-items:center;
}

.pdf-header button,
.pdf-header a{
    background:#fff;
    color:var(--navy);
    border:none;
    border-radius:5px;
    padding:7px 12px;
    cursor:pointer;
    text-decoration:none;
    font-family:Arial,sans-serif;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.pdf-viewer{
    flex:1;
    width:100%;
    border:none;
}

/* =========================================
   FOOTER
========================================= */

.footer{
    text-align:center;
    padding:18px 5px;
    color:#667085;
    font-family:Arial,sans-serif;
    font-size:11px;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:768px){

    .header{
        padding:14px;
    }

    .header h1{
        font-size:19px;
    }

    .container{
        padding:10px;
    }

    .main-tabs{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:6px;
    }

    .main-tab{
        padding:10px 7px;
        font-size:11px;
        min-height:42px;
    }

    .content-card{
        padding:12px;
    }

    .page-heading h2{
        font-size:17px;
    }

    .dynamic-tabs{
        flex-wrap:nowrap;
        overflow-x:auto;
        padding-bottom:6px;
    }

    .dynamic-tab{
        flex-shrink:0;
        white-space:nowrap;
    }

    .search-area{
        grid-template-columns:1fr;
    }

    .pdf-modal{
        padding:0;
    }

    .pdf-modal-content{
        width:100%;
        height:100vh;
        border-radius:0;
    }

    .pdf-header{
        padding:10px;
    }

    .pdf-title{
        max-width:40vw;
        font-size:12px;
    }

    .pdf-header a{
        display:none;
    }
}
</style>
</head>

<body>

<!-- =========================================
     HEADER
========================================= -->

<header class="header">
    <div class="header-inner">
        <h1>PHARMA REGULATORY & PRICING MASTER</h1>
        <p>Centralized Regulatory, Government Notification & Pricing Information System</p>
    </div>
</header>


<div class="container">

    <!-- =====================================
         FIXED MAIN TABS
    ====================================== -->

    <div class="main-tabs">

        <button class="main-tab active"
                onclick="openMainTab('banned', this)">
            Banned Product
        </button>

        <button class="main-tab"
                onclick="openMainTab('schedule', this)">
            Schedule List
        </button>

        <button class="main-tab"
                onclick="openMainTab('government-letter', this)">
            Govt. Letter Status
        </button>

        <button class="main-tab"
                onclick="openMainTab('regulatory-amendment', this)">
            Regulatory Amendment
        </button>

        <button class="main-tab"
                onclick="openMainTab('nppa-pricing', this)">
            NPPA Pricing
        </button>

        <button class="main-tab"
                onclick="openMainTab('notifications', this)">
            Notifications
        </button>

    </div>


    <!-- =====================================
         CONTENT
    ====================================== -->

    <div class="content-card">

        <div class="page-heading">

            <h2 id="pageTitle">
                BANNED PRODUCT MASTER
            </h2>

            <span class="record-count" id="recordCount">
                0 Documents
            </span>

        </div>


        <div class="breadcrumb" id="breadcrumb"></div>


        <!-- Dynamic Level 1 -->

        <div id="level1Tabs"></div>


        <!-- Dynamic Level 2 -->

        <div id="level2Tabs"></div>


        <!-- Dynamic Level 3 -->

        <div id="level3Tabs"></div>


        <!-- Search -->

        <div class="search-area">

            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="Search PDF by file name..."
                oninput="filterPDFs()"
            >

            <button class="btn-reset"
                    onclick="resetSearch()">
                Reset
            </button>

        </div>


        <!-- Table -->

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th style="width:80px;">Sr. No.</th>
                        <th>PDF Document Name</th>
                        <th style="width:150px;">Action</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>

            </table>

        </div>

    </div>


    <div class="footer">
        Pharma Regulatory & Pricing Master
    </div>

</div>


<!-- =========================================
     PDF VIEWER MODAL
========================================= -->

<div class="pdf-modal" id="pdfModal">

    <div class="pdf-modal-content">

        <div class="pdf-header">

            <div class="pdf-title" id="pdfTitle">
                Document Viewer
            </div>

            <div class="pdf-actions">

                <a id="openNewTab"
                   href="#"
                   target="_blank"
                   rel="noopener">
                    Open New Tab
                </a>

                <button onclick="closePDF()">
                    ✕ Close
                </button>

            </div>

        </div>

        <iframe
            id="pdfViewer"
            class="pdf-viewer"
            src="">
        </iframe>

    </div>

</div>


<script>

/* ============================================================
   ONE-TIME GITHUB CONFIGURATION
   ============================================================

   IMPORTANT:
   Replace these three values only once.

   Example:

   const GITHUB_OWNER = "jituduttajd-cmyk";
   const GITHUB_REPO = "YOUR-REPOSITORY";
   const GITHUB_BRANCH = "main";

============================================================ */

const GITHUB_OWNER = "YOUR-GITHUB-USERNAME";
const GITHUB_REPO = "YOUR-REPOSITORY-NAME";
const GITHUB_BRANCH = "main";


/* ============================================================
   GITHUB API BASE
============================================================ */

const GITHUB_API_BASE =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents`;

const RAW_BASE =
    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}`;


/* ============================================================
   MAIN TAB FOLDER CONFIGURATION

   These are only the ROOT folders.

   All subfolders inside them are automatically detected.

   Therefore:

   NEW SUB TAB =
   CREATE NEW FOLDER IN GITHUB

   NO HTML CODE CHANGE REQUIRED.

============================================================ */

const MAIN_TABS = {

    "banned": {
        title: "BANNED PRODUCT MASTER",
        folder: "data/banned-product"
    },

    "schedule": {
        title: "SCHEDULE MASTER",
        folder: "data/schedule"
    },

    "government-letter": {
        title: "GOVERNMENT LETTER STATUS",
        folder: "data/government-letter"
    },

    "regulatory-amendment": {
        title: "REGULATORY AMENDMENT MASTER",
        folder: "data/regulatory-amendment"
    },

    "nppa-pricing": {
        title: "NPPA PRICING",
        folder: "data/nppa-pricing"
    },

    "notifications": {
        title: "NOTIFICATIONS",
        folder: "data/notifications"
    }

};


/* ============================================================
   APPLICATION STATE
============================================================ */

let currentMainTab = "banned";

let currentPath = "";

let navigationStack = [];

let currentPDFs = [];

let currentFolders = [];


/* ============================================================
   OPEN MAIN TAB
============================================================ */

function openMainTab(tabName, button){

    currentMainTab = tabName;

    navigationStack = [];

    currentPDFs = [];

    resetSearch();


    document
        .querySelectorAll(".main-tab")
        .forEach(tab => tab.classList.remove("active"));


    button.classList.add("active");


    const config =
        MAIN_TABS[tabName];


    document.getElementById("pageTitle").innerText =
        config.title;


    currentPath =
        config.folder;


    clearDynamicTabs();


    updateBreadcrumb();


    loadFolder(currentPath);

}


/* ============================================================
   LOAD FOLDER FROM GITHUB API
============================================================ */

async function loadFolder(folderPath){

    showLoading();


    currentPath = folderPath;


    try{

        const url =
            `${GITHUB_API_BASE}/${encodePath(folderPath)}?ref=${encodeURIComponent(GITHUB_BRANCH)}`;


        const response =
            await fetch(url);


        if(!response.ok){

            if(response.status === 404){

                throw new Error("Folder not found");

            }

            if(response.status === 403){

                throw new Error(
                    "GitHub API limit reached. Please try again later."
                );

            }

            throw new Error("Unable to read GitHub folder");

        }


        const items =
            await response.json();


        const folders =
            items
                .filter(item => item.type === "dir")
                .sort((a,b) =>
                    a.name.localeCompare(
                        b.name,
                        undefined,
                        {numeric:true}
                    )
                );


        const pdfs =
            items
                .filter(item =>
                    item.type === "file" &&
                    item.name.toLowerCase().endsWith(".pdf")
                )
                .sort((a,b) =>
                    a.name.localeCompare(
                        b.name,
                        undefined,
                        {numeric:true}
                    )
                );


        currentFolders = folders;

        currentPDFs = pdfs;


        renderFolderNavigation();

        renderPDFTable(currentPDFs);


    }
    catch(error){

        console.error(error);

        currentFolders = [];
        currentPDFs = [];

        clearDynamicTabs();

        showError(error.message);

    }

}


/* ============================================================
   RENDER DYNAMIC FOLDER TABS

   The application detects folder hierarchy automatically.

============================================================ */

function renderFolderNavigation(){

    clearDynamicTabs();


    if(currentFolders.length === 0){

        return;

    }


    const level =
        navigationStack.length;


    let targetContainer;


    if(level === 0){

        targetContainer =
            document.getElementById("level1Tabs");

    }
    else if(level === 1){

        targetContainer =
            document.getElementById("level2Tabs");

    }
    else{

        targetContainer =
            document.getElementById("level3Tabs");

    }


    let html =
        `<div class="dynamic-tabs ${
            level === 0
                ? "level-2"
                : "level-3"
        }">`;


    currentFolders.forEach(folder => {

        html += `
            <button
                class="dynamic-tab"
                onclick="openFolder('${escapeJS(folder.path)}','${escapeJS(folder.name)}')">
                ${escapeHTML(formatFolderName(folder.name))}
            </button>
        `;

    });


    html += `</div>`;


    targetContainer.innerHTML =
        html;

}


/* ============================================================
   OPEN SUB FOLDER
============================================================ */

function openFolder(folderPath, folderName){

    navigationStack.push({
        name: folderName,
        path: folderPath
    });


    resetSearch();

    updateBreadcrumb();

    loadFolder(folderPath);

}


/* ============================================================
   GO BACK USING BREADCRUMB
============================================================ */

function goToLevel(levelIndex){

    const rootFolder =
        MAIN_TABS[currentMainTab].folder;


    if(levelIndex === -1){

        navigationStack = [];

        currentPath = rootFolder;

        updateBreadcrumb();

        resetSearch();

        loadFolder(rootFolder);

        return;

    }


    const selected =
        navigationStack[levelIndex];


    navigationStack =
        navigationStack.slice(0, levelIndex + 1);


    currentPath =
        selected.path;


    updateBreadcrumb();

    resetSearch();

    loadFolder(currentPath);

}


/* ============================================================
   BREADCRUMB
============================================================ */

function updateBreadcrumb(){

    const breadcrumb =
        document.getElementById("breadcrumb");


    const mainTitle =
        MAIN_TABS[currentMainTab].title;


    let html =
        `<span class="breadcrumb-link"
               style="cursor:pointer"
               onclick="goToLevel(-1)">
            ${escapeHTML(mainTitle)}
        </span>`;


    navigationStack.forEach((item,index) => {

        html += `
            <span style="margin:0 7px;color:#98a2b3">›</span>

            <span
                style="cursor:pointer"
                onclick="goToLevel(${index})">
                ${escapeHTML(formatFolderName(item.name))}
            </span>
        `;

    });


    breadcrumb.innerHTML = html;


    breadcrumb.style.display =
        navigationStack.length > 0
            ? "block"
            : "none";

}


/* ============================================================
   CLEAR DYNAMIC TABS
============================================================ */

function clearDynamicTabs(){

    document.getElementById("level1Tabs").innerHTML = "";

    document.getElementById("level2Tabs").innerHTML = "";

    document.getElementById("level3Tabs").innerHTML = "";

}


/* ============================================================
   RENDER PDF TABLE
============================================================ */

function renderPDFTable(pdfs){

    const tbody =
        document.getElementById("tableBody");


    if(!pdfs || pdfs.length === 0){

        let message =
            "No PDF document available in this folder.";


        if(currentFolders.length > 0){

            message =
                "Please select a folder/sub tab to view PDF documents.";

        }


        tbody.innerHTML = `
            <tr>
                <td colspan="3" class="no-data">
                    ${message}
                </td>
            </tr>
        `;


        updateRecordCount(0);

        return;

    }


    tbody.innerHTML =
        pdfs.map((pdf,index) => {

            const cleanName =
                formatPDFName(pdf.name);


            const pdfURL =
                getRawPDFURL(pdf.path);


            return `
                <tr>

                    <td>${index + 1}</td>

                    <td class="pdf-name">
                        ${escapeHTML(cleanName)}
                    </td>

                    <td>

                        <button
                            class="view-pdf-btn"
                            onclick="openPDF(
                                '${escapeJS(pdfURL)}',
                                '${escapeJS(cleanName)}'
                            )">

                            View PDF

                        </button>

                    </td>

                </tr>
            `;

        }).join("");


    updateRecordCount(pdfs.length);

}


/* ============================================================
   FILTER PDF
============================================================ */

function filterPDFs(){

    const keyword =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    if(!keyword){

        renderPDFTable(currentPDFs);

        return;

    }


    const filtered =
        currentPDFs.filter(pdf =>
            pdf.name
                .toLowerCase()
                .includes(keyword)
        );


    renderPDFTable(filtered);

}


/* ============================================================
   RESET SEARCH
============================================================ */

function resetSearch(){

    const search =
        document.getElementById("searchInput");


    if(search){

        search.value = "";

    }


    if(currentPDFs){

        renderPDFTable(currentPDFs);

    }

}


/* ============================================================
   OPEN PDF
============================================================ */

function openPDF(pdfURL, pdfName){

    const modal =
        document.getElementById("pdfModal");

    const viewer =
        document.getElementById("pdfViewer");

    const title =
        document.getElementById("pdfTitle");

    const newTab =
        document.getElementById("openNewTab");


    title.innerText =
        pdfName;


    viewer.src =
        pdfURL;


    newTab.href =
        pdfURL;


    modal.classList.add("show");

}


/* ============================================================
   CLOSE PDF
============================================================ */

function closePDF(){

    const modal =
        document.getElementById("pdfModal");

    const viewer =
        document.getElementById("pdfViewer");


    viewer.src = "";


    modal.classList.remove("show");

}


/* ============================================================
   CLOSE PDF ON ESCAPE
============================================================ */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closePDF();

        }

    }
);


/* ============================================================
   CLICK OUTSIDE MODAL TO CLOSE
============================================================ */

document
    .getElementById("pdfModal")
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closePDF();

            }

        }
    );


/* ============================================================
   RAW PDF URL
============================================================ */

function getRawPDFURL(path){

    return (
        `${RAW_BASE}/${encodePath(path)}`
    );

}


/* ============================================================
   ENCODE GITHUB PATH

   Keeps / intact while encoding folder/file names.
============================================================ */

function encodePath(path){

    return path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

}


/* ============================================================
   FORMAT FOLDER NAME

   Example:

   gazette-notification
   →

   Gazette Notification

============================================================ */

function formatFolderName(name){

    return String(name)
        .replace(/[-_]+/g," ")
        .replace(/\b\w/g,
            char => char.toUpperCase()
        );

}


/* ============================================================
   FORMAT PDF NAME

   Example:

   drugs-rules-1945.pdf
   →

   Drugs Rules 1945

============================================================ */

function formatPDFName(name){

    return formatFolderName(

        String(name)
            .replace(/\.pdf$/i,"")

    );

}


/* ============================================================
   RECORD COUNT
============================================================ */

function updateRecordCount(count){

    document
        .getElementById("recordCount")
        .innerText =
            `${count} ${
                count === 1
                    ? "Document"
                    : "Documents"
            }`;

}


/* ============================================================
   LOADING
============================================================ */

function showLoading(){

    document
        .getElementById("tableBody")
        .innerHTML = `
            <tr>
                <td colspan="3" class="loading">
                    Loading documents...
                </td>
            </tr>
        `;


    document
        .getElementById("recordCount")
        .innerText =
            "Loading...";

}


/* ============================================================
   ERROR
============================================================ */

function showError(message){

    document
        .getElementById("tableBody")
        .innerHTML = `
            <tr>
                <td colspan="3" class="no-data">
                    <strong>Unable to load documents.</strong>
                    <br><br>
                    ${escapeHTML(message)}
                </td>
            </tr>
        `;


    updateRecordCount(0);

}


/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ============================================================
   JAVASCRIPT ESCAPE
============================================================ */

function escapeJS(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;")
        .replace(/\r?\n/g," ");

}
