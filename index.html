<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12395f">
<title>Pharma Regulatory & Pricing Master</title>

<style>
:root{
    --navy:#12395f;
    --navy-dark:#082743;
    --blue:#1e5b8f;
    --light:#f4f7fa;
    --white:#ffffff;
    --border:#d7e0e9;
    --text:#1f2937;
    --muted:#667085;
}

*{box-sizing:border-box}

body{
    margin:0;
    background:var(--light);
    color:var(--text);
    font-family:Cambria,Georgia,serif;
}

.header{
    background:#fff;
    border-bottom:3px solid var(--navy);
    padding:16px 24px;
    position:sticky;
    top:0;
    z-index:100;
}

.header h1{
    margin:0;
    color:var(--navy);
    font-size:24px;
}

.header p{
    margin:5px 0 0;
    font-family:Arial,sans-serif;
    font-size:12px;
    color:var(--muted);
}

.container{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

/* MAIN TABS */

.main-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
}

.main-tab{
    padding:10px 16px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:7px;
    color:var(--navy);
    font-family:Cambria,Georgia,serif;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.main-tab:hover{
    background:#eef4f8;
}

.main-tab.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
}

/* CONTENT CARD */

.content-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
    min-height:600px;
}

.content-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--border);
    padding-bottom:12px;
}

.content-heading h2{
    margin:0;
    color:var(--navy);
    font-size:21px;
}

.record-count{
    background:#edf4fa;
    color:var(--navy);
    border-radius:20px;
    padding:6px 13px;
    font-family:Arial,sans-serif;
    font-size:12px;
    font-weight:bold;
}

/* BREADCRUMB */

.breadcrumb{
    margin:15px 0;
    padding:10px 13px;
    background:#f7f9fb;
    border:1px solid var(--border);
    border-radius:7px;
    font-family:Arial,sans-serif;
    font-size:12px;
    overflow-x:auto;
    white-space:nowrap;
}

.breadcrumb-item{
    color:var(--navy);
    font-weight:bold;
    cursor:pointer;
}

.breadcrumb-separator{
    margin:0 8px;
    color:#98a2b3;
}

/* FOLDER TABS */

.folder-section{
    margin-bottom:18px;
}

.folder-title{
    font-size:14px;
    color:#344054;
    font-weight:bold;
    margin-bottom:8px;
}

.folder-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.folder-tab{
    padding:9px 15px;
    border:1px solid var(--border);
    background:#fff;
    color:#344054;
    border-radius:7px;
    font-family:Cambria,Georgia,serif;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.folder-tab:hover{
    background:#eef4f8;
    border-color:#9eb7cc;
}

.folder-tab.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
}

/* SEARCH */

.search-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin:18px 0;
}

.search-box{
    width:100%;
    padding:11px 13px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
    font-family:Arial,sans-serif;
    font-size:13px;
}

.search-box:focus{
    border-color:var(--blue);
}

.reset-btn{
    padding:10px 20px;
    border:1px solid var(--border);
    border-radius:7px;
    background:#f4f6f8;
    color:#344054;
    cursor:pointer;
    font-family:Cambria,Georgia,serif;
    font-weight:bold;
}

/* TABLE */

.table-wrapper{
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:8px;
}

table{
    width:100%;
    min-width:650px;
    border-collapse:collapse;
    font-family:Arial,sans-serif;
    font-size:13px;
}

thead{
    background:var(--navy);
    color:#fff;
}

th{
    padding:12px;
    text-align:left;
}

td{
    padding:11px 12px;
    border-bottom:1px solid #e7edf2;
}

tbody tr:nth-child(even){
    background:#f8fafc;
}

tbody tr:hover{
    background:#eef5fa;
}

.pdf-name{
    font-weight:600;
    color:#344054;
}

.view-btn{
    padding:7px 13px;
    border:none;
    border-radius:6px;
    background:var(--navy);
    color:#fff;
    font-family:Cambria,Georgia,serif;
    font-weight:bold;
    cursor:pointer;
}

.view-btn:hover{
    background:var(--navy-dark);
}

.message-cell{
    padding:45px !important;
    text-align:center;
    color:var(--muted);
    font-family:Cambria,Georgia,serif;
}

/* PDF MODAL */

.pdf-modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,.65);
    padding:15px;
}

.pdf-modal.show{
    display:flex;
    align-items:center;
    justify-content:center;
}

.pdf-modal-content{
    width:98%;
    height:95vh;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.pdf-header{
    padding:12px 16px;
    background:var(--navy);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.pdf-title{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.pdf-actions{
    display:flex;
    gap:8px;
}

.pdf-actions button,
.pdf-actions a{
    border:none;
    background:#fff;
    color:var(--navy);
    padding:7px 11px;
    border-radius:5px;
    cursor:pointer;
    text-decoration:none;
    font-family:Arial,sans-serif;
    font-size:12px;
    font-weight:bold;
}

.pdf-viewer{
    width:100%;
    flex:1;
    border:none;
}

.footer{
    padding:18px;
    text-align:center;
    color:#667085;
    font-family:Arial,sans-serif;
    font-size:11px;
}

/* MOBILE */

@media(max-width:768px){

    .header{
        padding:13px;
    }

    .header h1{
        font-size:18px;
    }

    .container{
        padding:10px;
    }

    .main-tabs{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:6px;
    }

    .main-tab{
        font-size:11px;
        padding:10px 6px;
        min-height:42px;
    }

    .content-card{
        padding:12px;
    }

    .content-heading h2{
        font-size:17px;
    }

    .folder-tabs{
        flex-wrap:nowrap;
        overflow-x:auto;
        padding-bottom:5px;
    }

    .folder-tab{
        flex-shrink:0;
        white-space:nowrap;
    }

    .search-row{
        grid-template-columns:1fr;
    }

    .pdf-modal{
        padding:0;
    }

    .pdf-modal-content{
        width:100%;
        height:100vh;
        border-radius:0;
    }

    .pdf-title{
        max-width:45vw;
        font-size:12px;
    }

    .pdf-actions a{
        display:none;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>PHARMA REGULATORY & PRICING MASTER</h1>
    <p>Centralized Regulatory, Government Notification & Pricing Information System</p>
</header>

<div class="container">

    <!-- MAIN TABS -->
    <div class="main-tabs">

        <button class="main-tab active" onclick="selectMainTab('banned-product',this)">
            Banned Product Master
        </button>

        <button class="main-tab" onclick="selectMainTab('schedule',this)">
            Schedule Master
        </button>

        <button class="main-tab" onclick="selectMainTab('government-letter',this)">
            Government Letter Master
        </button>

        <button class="main-tab" onclick="selectMainTab('regulatory-amendment',this)">
            Regulatory Amendment Master
        </button>

        <button class="main-tab" onclick="selectMainTab('nppa-pricing',this)">
            NPPA Pricing
        </button>

        <button class="main-tab" onclick="selectMainTab('notifications',this)">
            Notifications
        </button>

    </div>

    <div class="content-card">

        <div class="content-heading">
            <h2 id="pageTitle">BANNED PRODUCT MASTER</h2>
            <span class="record-count" id="recordCount">0 Documents</span>
        </div>

        <!-- BREADCRUMB -->
        <div id="breadcrumb" class="breadcrumb"></div>

        <!-- DYNAMIC FOLDER TABS -->
        <div id="folderNavigation"></div>

        <!-- SEARCH -->
        <div class="search-row">
            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="Search PDF document..."
                oninput="filterPDFs()"
            >
            <button class="reset-btn" onclick="resetSearch()">Reset</button>
        </div>

        <!-- PDF TABLE -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width:80px">Sr. No.</th>
                        <th>PDF Document Name</th>
                        <th style="width:140px">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>

    <div class="footer">
        Pharma Regulatory & Pricing Master
    </div>

</div>

<!-- PDF MODAL -->
<div class="pdf-modal" id="pdfModal">
    <div class="pdf-modal-content">

        <div class="pdf-header">

            <div class="pdf-title" id="pdfTitle">
                Document Viewer
            </div>

            <div class="pdf-actions">
                <a id="openNewTab" href="#" target="_blank">Open New Tab</a>
                <button onclick="closePDF()">✕ Close</button>
            </div>

        </div>

        <iframe id="pdfViewer" class="pdf-viewer"></iframe>

    </div>
</div>

<script>

/* =====================================================
   GITHUB CONFIGURATION
   CHANGE ONLY THESE VALUES
===================================================== */

const GITHUB_OWNER = "YOUR-GITHUB-USERNAME";
const GITHUB_REPO = "YOUR-REPOSITORY-NAME";
const GITHUB_BRANCH = "main";


/* =====================================================
   MAIN TAB ROOT FOLDERS
===================================================== */

const MAIN_CONFIG = {

    "banned-product": {
        title: "BANNED PRODUCT MASTER",
        folder: "data/banned-product"
    },

    "schedule": {
        title: "SCHEDULE MASTER",
        folder: "data/schedule"
    },

    "government-letter": {
        title: "GOVERNMENT LETTER MASTER",
        folder: "data/government-letter"
    },

    "regulatory-amendment": {
        title: "REGULATORY AMENDMENT MASTER",
        folder: "data/regulatory-amendment"
    },

    "nppa-pricing": {
        title: "NPPA PRICING",
        folder: "data/nppa-pricing"
    },

    "notifications": {
        title: "NOTIFICATIONS",
        folder: "data/notifications"
    }

};


/* =====================================================
   API BASE URL
===================================================== */

const API_BASE =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents`;

const RAW_BASE =
    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}`;


/* =====================================================
   APPLICATION STATE
===================================================== */

let activeMainTab = "banned-product";

let rootPath = "";

let currentPath = "";

let pathHistory = [];

let currentItems = [];

let currentPDFs = [];


/* =====================================================
   INITIAL LOAD
===================================================== */

document.addEventListener("DOMContentLoaded", function(){

    const button =
        document.querySelector(".main-tab.active");

    selectMainTab(
        "banned-product",
        button
    );

});


/* =====================================================
   SELECT MAIN TAB
===================================================== */

function selectMainTab(tabKey, button){

    activeMainTab = tabKey;

    document.querySelectorAll(".main-tab")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    const config = MAIN_CONFIG[tabKey];

    document.getElementById("pageTitle").innerText =
        config.title;

    rootPath =
        config.folder;

    currentPath =
        rootPath;

    pathHistory = [];

    currentPDFs = [];

    document.getElementById("searchInput").value = "";

    loadCurrentFolder();

}


/* =====================================================
   LOAD CURRENT FOLDER

   Works with unlimited folder depth.
===================================================== */

async function loadCurrentFolder(){

    showLoading();

    try{

        const url =
            `${API_BASE}/${encodePath(currentPath)}?ref=${encodeURIComponent(GITHUB_BRANCH)}`;

        const response =
            await fetch(url);

        if(!response.ok){

            if(response.status === 404){

                throw new Error(
                    "Folder not found in GitHub repository."
                );

            }

            if(response.status === 403){

                throw new Error(
                    "GitHub API request limit reached. Please try again later."
                );

            }

            throw new Error(
                "Unable to load GitHub folder."
            );

        }

        const items =
            await response.json();

        currentItems =
            Array.isArray(items) ? items : [];

        currentPDFs =
            currentItems
                .filter(item =>
                    item.type === "file" &&
                    /\.pdf$/i.test(item.name)
                )
                .sort((a,b) =>
                    a.name.localeCompare(
                        b.name,
                        undefined,
                        {numeric:true}
                    )
                );


        renderBreadcrumb();

        renderFolderTabs();

        renderPDFTable(currentPDFs);

    }
    catch(error){

        console.error(error);

        document.getElementById("folderNavigation").innerHTML = "";

        document.getElementById("breadcrumb").innerHTML =
            "";

        showMessage(error.message);

    }

}


/* =====================================================
   RENDER FOLDER TABS

   Shows ALL folders available at CURRENT LEVEL.

   Example:

   Notifications
   → CDSCO | NPPA | State FDA | FSSAI

   Click CDSCO

   → Act & Rules | Amendment | Circular | Gazette...
===================================================== */

function renderFolderTabs(){

    const container =
        document.getElementById("folderNavigation");

    const folders =
        currentItems
            .filter(item => item.type === "dir")
            .sort((a,b) =>
                a.name.localeCompare(
                    b.name,
                    undefined,
                    {numeric:true}
                )
            );


    if(folders.length === 0){

        container.innerHTML = "";

        return;

    }


    let html = `
        <div class="folder-section">
            <div class="folder-tabs">
    `;


    folders.forEach(folder => {

        const active =
            folder.path === currentPath
                ? "active"
                : "";

        html += `
            <button
                class="folder-tab ${active}"
                onclick="openFolder('${escapeJS(folder.path)}','${escapeJS(folder.name)}')">
                ${escapeHTML(formatName(folder.name))}
            </button>
        `;

    });


    html += `
            </div>
        </div>
    `;


    container.innerHTML = html;

}


/* =====================================================
   OPEN ANY FOLDER

   NO LIMIT ON SUBTAB LEVEL.
===================================================== */

function openFolder(path, name){

    pathHistory.push({
        path: currentPath,
        name: name
    });

    currentPath = path;

    currentPDFs = [];

    document.getElementById("searchInput").value = "";

    loadCurrentFolder();

}


/* =====================================================
   BREADCRUMB

   Example:

   Notifications > CDSCO > Amendment
===================================================== */

function renderBreadcrumb(){

    const breadcrumb =
        document.getElementById("breadcrumb");


    let html = `
        <span
            class="breadcrumb-item"
            onclick="goToRoot()">
            ${escapeHTML(MAIN_CONFIG[activeMainTab].title)}
        </span>
    `;


    const pathParts =
        currentPath
            .replace(rootPath,"")
            .split("/")
            .filter(Boolean);


    let buildPath =
        rootPath;


    pathParts.forEach(part => {

        buildPath += "/" + part;

        html += `
            <span class="breadcrumb-separator">›</span>

            <span
                class="breadcrumb-item"
                onclick="goToPath('${escapeJS(buildPath)}')">
                ${escapeHTML(formatName(part))}
            </span>
        `;

    });


    breadcrumb.innerHTML = html;

}


/* =====================================================
   GO ROOT
===================================================== */

function goToRoot(){

    currentPath =
        rootPath;

    pathHistory = [];

    document.getElementById("searchInput").value = "";

    loadCurrentFolder();

}


/* =====================================================
   GO TO ANY BREADCRUMB PATH
===================================================== */

function goToPath(path){

    currentPath = path;

    document.getElementById("searchInput").value = "";

    loadCurrentFolder();

}


/* =====================================================
   RENDER PDF TABLE
===================================================== */

function renderPDFTable(pdfs){

    const tbody =
        document.getElementById("tableBody");


    if(!pdfs || pdfs.length === 0){

        const folderCount =
            currentItems.filter(
                item => item.type === "dir"
            ).length;


        const message =
            folderCount > 0
                ? "Please select a sub-tab to view PDF documents."
                : "No PDF document available in this folder.";


        tbody.innerHTML = `
            <tr>
                <td colspan="3" class="message-cell">
                    ${message}
                </td>
            </tr>
        `;

        updateRecordCount(0);

        return;

    }


    let html = "";


    pdfs.forEach((pdf,index) => {

        const pdfName =
            formatPDFName(pdf.name);

        const pdfURL =
            getRawURL(pdf.path);


        html += `
            <tr>

                <td>${index + 1}</td>

                <td class="pdf-name">
                    ${escapeHTML(pdfName)}
                </td>

                <td>
                    <button
                        class="view-btn"
                        onclick="openPDF(
                            '${escapeJS(pdfURL)}',
                            '${escapeJS(pdfName)}'
                        )">
                        View PDF
                    </button>
                </td>

            </tr>
        `;

    });


    tbody.innerHTML = html;

    updateRecordCount(pdfs.length);

}


/* =====================================================
   SEARCH
===================================================== */

function filterPDFs(){

    const keyword =
        document.getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    const filtered =
        currentPDFs.filter(pdf =>
            pdf.name
                .toLowerCase()
                .includes(keyword)
        );


    renderPDFTable(filtered);

}


/* =====================================================
   RESET SEARCH
===================================================== */

function resetSearch(){

    document.getElementById("searchInput").value = "";

    renderPDFTable(currentPDFs);

}


/* =====================================================
   PDF VIEWER
===================================================== */

function openPDF(url,name){

    document.getElementById("pdfTitle").innerText =
        name;

    document.getElementById("pdfViewer").src =
        url;

    document.getElementById("openNewTab").href =
        url;

    document.getElementById("pdfModal")
        .classList.add("show");

}


function closePDF(){

    document.getElementById("pdfViewer").src = "";

    document.getElementById("pdfModal")
        .classList.remove("show");

}


/* =====================================================
   ESC KEY CLOSE
===================================================== */

document.addEventListener("keydown",function(event){

    if(event.key === "Escape"){

        closePDF();

    }

});


/* =====================================================
   OUTSIDE CLICK CLOSE
===================================================== */

document.getElementById("pdfModal")
.addEventListener("click",function(event){

    if(event.target === this){

        closePDF();

    }

});


/* =====================================================
   RAW PDF URL
===================================================== */

function getRawURL(path){

    return (
        RAW_BASE +
        "/" +
        encodePath(path)
    );

}


/* =====================================================
   LOADING
===================================================== */

function showLoading(){

    document.getElementById("tableBody").innerHTML = `
        <tr>
            <td colspan="3" class="message-cell">
                Loading documents...
            </td>
        </tr>
    `;

    document.getElementById("recordCount").innerText =
        "Loading...";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(message){

    document.getElementById("tableBody").innerHTML = `
        <tr>
            <td colspan="3" class="message-cell">
                ${escapeHTML(message)}
            </td>
        </tr>
    `;

    updateRecordCount(0);

}


/* =====================================================
   RECORD COUNT
===================================================== */

function updateRecordCount(count){

    document.getElementById("recordCount").innerText =
        count +
        " " +
        (count === 1
            ? "Document"
            : "Documents");

}


/* =====================================================
   FORMAT FOLDER NAME
===================================================== */

function formatName(name){

    return String(name)
        .replace(/[-_]+/g," ")
        .replace(/\b\w/g,function(letter){
            return letter.toUpperCase();
        });

}


/* =====================================================
   FORMAT PDF NAME
===================================================== */

function formatPDFName(name){

    return formatName(
        String(name).replace(/\.pdf$/i,"")
    );

}


/* =====================================================
   ENCODE PATH
===================================================== */

function encodePath(path){

    return String(path)
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   JAVASCRIPT ESCAPE
===================================================== */

function escapeJS(value){

    return String(value || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\r/g,"")
        .replace(/\n/g," ");

}

</script>

</body>
</html>
